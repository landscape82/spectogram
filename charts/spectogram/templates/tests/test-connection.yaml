apiVersion: v1
kind: Pod
metadata:
  name: {{ include "spectogram.fullname" . }}-test-connection
  labels:
    {{- include "spectogram.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - "sh"
        - "-c"
        - |
          set -e
          # Request the directory rather than index.html: Go's file server
          # redirects the latter to ./, which BusyBox wget cannot follow.
          url="http://{{ include "spectogram.fullname" . }}:{{ .Values.service.port }}/web/"
          for i in $(seq 1 10); do
            if wget -q -T 5 -O- "$url" | grep -qi plotly; then
              echo "OK: web viewer served plotly page"
              exit 0
            fi
            sleep 3
          done
          echo "FAIL: could not fetch $url after retries"
          exit 1
